name: Sync Biome Schema

on:
  pull_request:
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-biome-schema:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync biome schema version
        run: |
          VERSION=$(node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf-8'));console.log(p.devDependencies['@biomejs/biome']?.replace('^','')??'')")
          if [ -z "$VERSION" ]; then exit 0; fi

          for f in biome.json configs/_biome.json; do
            if [ -f "$f" ]; then
              sed -i "s|biomejs.dev/schemas/[^/]*/schema.json|biomejs.dev/schemas/${VERSION}/schema.json|" "$f"
            fi
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync biome schema version"
          git push
